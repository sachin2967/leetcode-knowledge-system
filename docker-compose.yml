services:
  api:
    build: .
    command: ["python", "-m", "uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      LKS_OLLAMA_URL: ${LKS_OLLAMA_URL:-http://host.docker.internal:11434}
      LKS_OLLAMA_MODEL: ${LKS_OLLAMA_MODEL:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/raw:/app/data/raw
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  ui:
    build: .
    command: ["python", "-m", "streamlit", "run", "streamlit_app/app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    environment:
      LKS_API_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
