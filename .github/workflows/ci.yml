name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check src tests scripts streamlit_app
      - name: Test
        run: python -m pytest -q
      - name: Evaluate ranking
        run: python -m scripts.evaluate_ranking
      - name: Evaluate guardrails
        run: python -m scripts.evaluate_guardrails
      - name: Validate container configuration
        run: docker compose config --quiet
      - name: Build and smoke test local deployment
        run: |
          docker compose up --build -d
          python - <<'PY'
          import json
          import time
          import urllib.request

          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2) as response:
                      assert json.load(response)["status"] == "ok"
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise RuntimeError("API health check did not become ready")

          request = urllib.request.Request(
              "http://127.0.0.1:8000/mentor",
              data=json.dumps({"problem_id": 76, "question": "How should I start?", "level": 1}).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=5) as response:
              hint = json.load(response)
          assert hint["retrieved_concepts"] == ["sliding_window"]

          with urllib.request.urlopen("http://127.0.0.1:8501", timeout=5) as response:
              assert response.status == 200
          PY
          docker compose down
